name: Quality

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  unit:
    name: Unit, localization, and policy tests
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore "Tests\Task_Flyout.Tests\Task_Flyout.Tests.csproj" --locked-mode
      - name: Restore application dependencies
        shell: pwsh
        run: dotnet restore "Task_Flyout.csproj" --locked-mode
      - name: Audit application dependencies
        shell: pwsh
        run: |
          $report = dotnet list "Task_Flyout.csproj" package --vulnerable --include-transitive --format json --no-restore | ConvertFrom-Json
          $findings = @(
            foreach ($project in @($report.projects)) {
              foreach ($framework in @($project.frameworks)) {
                foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                  if ($null -eq $package) { continue }
                  foreach ($vulnerability in @($package.vulnerabilities)) {
                    if ($null -eq $vulnerability) { continue }
                    [pscustomobject]@{
                      Package = $package.id
                      Severity = $vulnerability.severity
                      Advisory = $vulnerability.advisoryurl
                    }
                  }
                }
              }
            }
          )
          $high = @($findings | Where-Object Severity -eq 'High')
          if ($high.Count -gt 0) {
            $high | Format-Table -AutoSize | Out-Host
            throw "High-severity NuGet vulnerabilities must be fixed before merge."
          }
          if ($findings.Count -gt 0) {
            $findings | Format-Table -AutoSize | Out-Host
            Write-Warning "NuGet vulnerabilities remain, but none are high severity. Review them before release."
          }
      - name: Run tests
        shell: pwsh
        run: dotnet test "Tests\Task_Flyout.Tests\Task_Flyout.Tests.csproj" -c Release --no-restore

  application:
    name: Application build and packaged PR smoke
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
      - name: Prepare non-secret build inputs
        shell: pwsh
        run: |
          Copy-Item -LiteralPath "credentials.example.json" -Destination "credentials.json"
          @'
          namespace Task_Flyout.Services;
          internal static class Secrets
          {
              internal const string MicrosoftClientId = "00000000-0000-0000-0000-000000000000";
          }
          '@ | Set-Content -LiteralPath "Secrets.cs" -Encoding UTF8
      - name: Restore application runtime
        shell: pwsh
        run: dotnet restore "Task_Flyout.csproj" --locked-mode -p:RuntimeIdentifier=win-x64 -p:SelfContained=true -p:PublishReadyToRun=true
      - name: Build application with warnings as errors
        shell: pwsh
        run: dotnet build "Task_Flyout.csproj" -c Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:SelfContained=true -p:BuildStandaloneTaskbarNative=false --no-restore -warnaserror
      - name: Verify formatting for changed C# files
        shell: pwsh
        run: |
          $base = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') { "origin/$env:GITHUB_BASE_REF" } else { 'HEAD^' }
          $changed = @(git diff --name-only $base HEAD -- '*.cs' '*.xaml.cs' | Where-Object { $_ })
          if ($changed.Count -gt 0) {
            dotnet format "Task_Flyout.csproj" whitespace --verify-no-changes --no-restore --verbosity minimal --include $changed
            if ($LASTEXITCODE -ne 0) { throw 'Changed C# files are not whitespace-formatted.' }
          }
      - name: Build unsigned MSIX package
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP "task-flyout-quality-package"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          dotnet msbuild "Task_Flyout.csproj" /m `
            /p:RestoreLockedMode=true `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxBundle=Never `
            /p:AppxPackageDir="$packageDir\" `
            /p:AppxPackageSigningEnabled=false `
            /p:BuildStandaloneTaskbarNative=false
          $packages = @(Get-ChildItem -LiteralPath $packageDir -Recurse -File -Filter '*.msix')
          if ($packages.Count -eq 0) { throw 'No unsigned MSIX package was produced.' }
      - name: Register package for current-revision smoke
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP "task-flyout-quality-package"
          $msix = Get-ChildItem -LiteralPath $packageDir -Recurse -File -Filter 'Task_Flyout*.msix' |
            Where-Object FullName -NotMatch '[\\/]Dependencies[\\/]' | Select-Object -First 1
          if ($null -eq $msix) { throw 'Task Flyout MSIX was not found.' }
          $dependency = Get-ChildItem -LiteralPath $packageDir -Recurse -File -Filter 'Microsoft.WindowsAppRuntime*.msix' |
            Where-Object FullName -Match '[\\/]Dependencies[\\/]x64[\\/]' | Select-Object -First 1
          if ($null -ne $dependency) { Add-AppxPackage -Path $dependency.FullName }
          $makeAppx = Get-ChildItem -LiteralPath "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Get-Item -LiteralPath (Join-Path $_.FullName 'x64\makeappx.exe') -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if ($null -eq $makeAppx) { throw 'makeappx.exe was not found.' }
          $loose = Join-Path $env:RUNNER_TEMP 'task-flyout-quality-loose'
          & $makeAppx.FullName unpack /p $msix.FullName /d $loose /o
          if ($LASTEXITCODE -ne 0) { throw 'The quality package could not be unpacked.' }
          Add-AppxPackage -Register (Join-Path $loose 'AppxManifest.xml')
      - name: Run packaged smoke
        shell: pwsh
        run: .\scripts\test-packaged-smoke.ps1
      - name: Clean package and build inputs
        if: always()
        shell: pwsh
        run: |
          Get-Process -Name 'Task_Flyout' -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-AppxPackage -Name 'Uranus92.TaskFlyout' | Remove-AppxPackage -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath 'credentials.json', 'Secrets.cs' -Force -ErrorAction SilentlyContinue

  packaged:
    name: Packaged smoke and soak
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out tested revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Download latest beta release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=20" | ConvertFrom-Json
          $release = $releases | Where-Object prerelease | Select-Object -First 1
          if ($null -eq $release) { throw "A beta release was not found." }
          $asset = $release.assets | Where-Object name -Like "*-win-x64.zip" | Select-Object -First 1
          if ($null -eq $asset) { throw "The beta release has no x64 zip asset." }
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\release" -Force | Out-Null
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\release\beta.zip"
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\release\beta.zip" -DestinationPath "$env:RUNNER_TEMP\release\expanded" -Force

      - name: Register package for UI testing
        shell: pwsh
        run: |
          $msix = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\release\expanded" -Recurse -File -Filter "Task_Flyout*.msix" | Select-Object -First 1
          if ($null -eq $msix) { throw "Task Flyout MSIX was not found." }
          $dependency = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\release\expanded" -Recurse -File -Filter "Microsoft.WindowsAppRuntime*.msix" |
            Where-Object FullName -Match "[\\/]Dependencies[\\/]x64[\\/]" |
            Select-Object -First 1
          if ($null -ne $dependency) { Add-AppxPackage -Path $dependency.FullName }
          $makeAppx = Get-ChildItem -LiteralPath "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Get-Item -LiteralPath (Join-Path $_.FullName "x64\makeappx.exe") -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if ($null -eq $makeAppx) { throw "makeappx.exe was not found." }
          $loose = "$env:RUNNER_TEMP\release\loose"
          & $makeAppx.FullName unpack /p $msix.FullName /d $loose /o
          if ($LASTEXITCODE -ne 0) { throw "The beta package could not be unpacked." }
          Add-AppxPackage -Register (Join-Path $loose "AppxManifest.xml")

      - name: Run packaged smoke
        shell: pwsh
        run: .\scripts\test-packaged-smoke.ps1

      - name: Run packaged soak
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          TASKFLYOUT_SOAK_MINUTES: 10
          TASKFLYOUT_SOAK_MAX_HANDLE_GROWTH: 150
          TASKFLYOUT_SOAK_MAX_PRIVATE_MB_GROWTH: 64
        run: .\scripts\test-packaged-soak.ps1

      - name: Upload soak results
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packaged-soak-${{ github.run_id }}
          path: TestResults/packaged-soak.csv
          if-no-files-found: warn
          retention-days: 14

      - name: Remove test package
        if: always()
        shell: pwsh
        run: |
          Get-Process -Name "Task_Flyout" -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-AppxPackage -Name "Uranus92.TaskFlyout" | Remove-AppxPackage -ErrorAction SilentlyContinue
